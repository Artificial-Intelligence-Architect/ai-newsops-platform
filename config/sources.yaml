# Inventaire des flux RSS pour le projet de traçabilité de la veille santé
# Statuts :
#   confirme      : flux lu directement (XML fourni ou validé dans une source fiable)
#   a_tester      : URL trouvée dans une source tierce, à valider avec feedparser
#   a_completer   : source identifiée, URL du flux à extraire de la page
#   en_echec      : URL testée, flux invalide ou vide (bozo True, 0 entrée) ; à réessayer ou remplacer
# Dernière mise à jour : 2026-10-22

meta:
  projet: traçabilité de la preuve pour la veille santé
  regle_contenu: >
    Conserver uniquement les métadonnées (titre, date, lien, guid, chapô).
    Ne pas redistribuer le texte intégral. Citer la source.
  politique_collecte: >
    Une requête par flux et par heure maximum, avec cache local et en-tête User-Agent identifiant.

